summary: Use Excel templates to import customers, suppliers, parts, bills of materials, your current sales order book and current purchase orders with Fraction ERP's self-service data import tool.
faq_question: Can we import our existing data?
faq_answer: Yes. Fraction ERP's self-service data import tool uses Excel templates to import customers, suppliers, parts, bills of materials, your current sales order book and current purchase orders.
records:
  - title: Customers
    icon: bi-people
    description: Bring your existing customer records into Fraction ERP.
  - title: Suppliers
    icon: bi-truck
    description: Import the supplier records used by your purchasing team.
  - title: Parts
    icon: bi-box-seam
    description: Bring across the part records your manufacturing workflows depend on.
  - title: Bills of materials
    icon: bi-diagram-3
    description: Import your existing BOMs as part of preparing for production in Fraction ERP.
  - title: Current sales order book
