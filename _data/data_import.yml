faqs:
  - question: Can we import our data ourselves?
    answer: Yes. Fraction ERP provides a self-service data import tool using Excel templates, so your team can prepare and import its existing records during migration.
  - question: Which records can we import?
    answer: The tool supports customers, suppliers, parts, bills of materials, your current sales order book and current purchase orders, using Excel templates.
  - question: Can we use data from our existing ERP system?
    answer: Prepare the records from your existing system in the relevant Excel templates. When planning a switch, confirm how you can export those records from your current supplier and review the data you need to carry forward.
  - question: Can we bring across our current sales and purchase orders?
    answer: Yes. The import tool covers your current sales order book and current purchase orders, alongside customers, suppliers, parts and BOMs.
